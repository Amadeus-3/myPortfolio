server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Vite's hashed bundles never change under the same name: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # The 3D head. nginx doesn't know .glb, so set its type explicitly; cache for a day.
  location ~* \.glb$ {
    types { }
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # The page itself: always revalidate, so a new deploy shows up immediately.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri/ /index.html;
  }
}
